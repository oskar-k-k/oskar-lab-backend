spring.application.name=backend
server.port=${SERVER_PORT:10081}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:10054/oskarlab}
spring.datasource.username=${DATABASE_USERNAME:oskar}
spring.datasource.password=${DATABASE_PASSWORD:dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
auth.bridge-secret=${AUTH_BRIDGE_SECRET:}
orbit.base-url=${ORBIT_BASE_URL:}
orbit.project-keys-file=${ORBIT_PROJECT_KEYS_FILE:}
orbit.asset-manifest=${ORBIT_ASSET_MANIFEST:}

# Travel attachments are bounded; the domain also validates size and file signatures.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=6MB

# Explicit opt-in for documentation on deployed instances; no remote validator.
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.validator-url=
springdoc.swagger-ui.persist-authorization=false
springdoc.api-docs.version=OPENAPI_3_0
