spring.application.name=backend
server.port=${SERVER_PORT:10081}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:10054/oskarlab}
spring.datasource.username=${DATABASE_USERNAME:oskar}
spring.datasource.password=${DATABASE_PASSWORD:dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
auth.bridge-secret=${AUTH_BRIDGE_SECRET:}
