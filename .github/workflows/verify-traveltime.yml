name: Verify TravelTime storage migrations
on:
  push:
    branches: [feature/traveltime-storage, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: traveltest
          POSTGRES_PASSWORD: synthetic-travel-database-password
          POSTGRES_DB: traveltest
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U traveltest -d traveltest" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRAVEL_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/traveltest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew && ./gradlew --no-daemon test build
